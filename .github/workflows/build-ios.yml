name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update || true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p /tmp/ipa_out
          APP=$(find build/ios/iphoneos -name "Runner.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Runner.app not found"
            find build/ios -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r ipa_out/ReaderNover.ipa Payload/
          ls -lh /tmp/ipa_out/ReaderNover.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReaderNover-IPA
          path: /tmp/ipa_out/ReaderNover.ipa

      - name: Upload build log (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: build/ios/
          if-no-files-found: warn
